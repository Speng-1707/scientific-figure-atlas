<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>免登录快速上传 · 科研图鉴</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"></head><body><header><a class="brand" href="./">◈ 科研图鉴</a><a class="button outline" href="./">返回图库</a></header><main class="form-page"><section class="upload-panel"><div class="eyebrow">ANONYMOUS QUICK UPLOAD</div><h1>无需登录，<br>捕获一瞬间的灵感。</h1><p>只需选择图片。提交后请保存管理链接，它也是邀请共同贡献者编辑的私密钥匙。</p><form id="anonymous-form"><label>科研图片（必填，最大 15 MB）<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/tiff" required></label><label>图片标题（可稍后补充）<input name="title" maxlength="160"></label><label>投稿人昵称（可选）<input name="contributor_name" maxlength="120"></label><label>推荐评分<select name="rating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></label><label>推荐理由（可选）<textarea name="why"></textarea></label><label>未来用途（可选）<textarea name="usage"></textarea></label><button class="button" type="submit">上传并生成管理链接</button><p id="upload-status" aria-live="polite"></p></form><section id="upload-success" hidden><h2>上传成功</h2><p>请立即保存下面的私密管理链接。任何获得链接的人都可以协作编辑。</p><a class="button" id="manage-link">管理与协作编辑</a></section></section></main><script src="config.js"></script><script src="anonymous-upload.js"></script></body></html>
