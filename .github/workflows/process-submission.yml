name: Process figure submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: figure-submissions
  cancel-in-progress: false

jobs:
  process:
    if: contains(github.event.issue.body, '### 图片标题') && contains(github.event.issue.body, '### 科研图片')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyze and add submission
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/process_submission.py
      - name: Commit generated gallery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/assets
          git commit -m "Add figure from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy updated gallery
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm submission
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `已完成分类与配色提取，并收录到[科研图鉴](${{ steps.deployment.outputs.page_url }})。本次另从 PDF 自动抓取 ${{ steps.process.outputs.pdf_figures }} 张图片。`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

  report-failure:
    needs: process
    if: failure() && contains(github.event.issue.body, '### 图片标题') && contains(github.event.issue.body, '### 科研图片')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '自动处理失败。请确认图片格式为 PNG/JPG/WebP/TIFF、附件大小符合限制，并联系仓库管理员查看 Actions 日志。'
            });
