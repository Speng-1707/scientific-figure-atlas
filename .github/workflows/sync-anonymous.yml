name: Sync anonymous uploads

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: figure-data-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Obtain short-lived sync identity
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('figure-atlas-sync');
            core.setSecret(token);
            core.exportVariable('SYNC_OIDC_TOKEN', token);
      - name: Fetch pending uploads
        run: >-
          curl --fail --silent --show-error
          -H "Authorization: Bearer $SYNC_OIDC_TOKEN"
          "https://scientific-figure-atlas-upload.academic-image-hub.workers.dev/api/sync/pending"
          -o anonymous-pending.json
      - name: Process uploads
        id: process
        env:
          ANONYMOUS_INPUT: anonymous-pending.json
        run: python scripts/process_anonymous.py
      - name: Commit synchronized uploads
        if: steps.process.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/assets
          git commit -m "Sync anonymous figure uploads"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.process.outputs.count != '0'
      - uses: actions/upload-pages-artifact@v4
        if: steps.process.outputs.count != '0'
        with:
          path: site
      - name: Deploy updated gallery
        if: steps.process.outputs.count != '0'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark uploads synchronized
        if: steps.process.outputs.count != '0'
        run: >-
          curl --fail --silent --show-error -X POST
          -H "Authorization: Bearer $SYNC_OIDC_TOKEN"
          -H "Content-Type: application/json"
          --data-binary @anonymous-synced.json
          "https://scientific-figure-atlas-upload.academic-image-hub.workers.dev/api/sync/complete"
